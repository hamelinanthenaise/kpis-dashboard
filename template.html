<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly KPIs</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f6fa;color:#1a1a2e;min-height:100vh}
  header{background:#fff;border-bottom:1px solid #e8eaf0;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  header h1{font-size:15px;font-weight:600;color:#1a1a2e;display:flex;align-items:center;gap:8px}
  .meta{font-size:12px;color:#8892a4}
  nav{display:flex;gap:4px;padding:0 24px;background:#fff;border-bottom:1px solid #e8eaf0;overflow-x:auto}
  nav button{padding:10px 16px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:#8892a4;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
  nav button.active{color:#6c5ce7;border-bottom-color:#6c5ce7}
  nav button:hover:not(.active){color:#1a1a2e}
  .badge{display:inline-block;background:#e17055;color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;margin-left:4px;vertical-align:middle}
  .content{padding:24px;max-width:1400px;margin:0 auto}

  /* Upload zone */
  #upload-zone{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:24px}
  #upload-zone h2{font-size:24px;font-weight:700;color:#1a1a2e;display:flex;align-items:center;gap:10px}
  #upload-zone p{color:#8892a4;font-size:14px}
  .upload-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  .upload-card{width:200px;padding:24px 16px;border:2px dashed #d0d5e8;border-radius:12px;text-align:center;cursor:pointer;transition:all .2s;background:#fff}
  .upload-card:hover,.upload-card.loaded{border-color:#6c5ce7;background:#f8f7ff}
  .upload-card.loaded{border-style:solid}
  .upload-card .icon{font-size:32px;margin-bottom:12px}
  .upload-card h3{font-size:13px;font-weight:600;margin-bottom:4px}
  .upload-card p{font-size:11px;color:#8892a4}
  .upload-card input{display:none}
  .upload-card .fname{font-size:11px;color:#6c5ce7;margin-top:6px;word-break:break-all}
  #btn-generate{padding:12px 32px;background:#6c5ce7;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
  #btn-generate:disabled{background:#d0d5e8;cursor:not-allowed}
  #btn-generate:not(:disabled):hover{background:#5a4bd1}

  /* Cards */
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:24px}
  .card{background:#fff;border-radius:12px;padding:20px;border:1px solid #e8eaf0;transition:box-shadow .2s}
  .card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .card-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#8892a4;margin-bottom:8px}
  .card-value{font-size:28px;font-weight:700;color:#1a1a2e;line-height:1}
  .card-sub{font-size:12px;color:#8892a4;margin-top:6px}
  .delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;margin-top:8px}
  .delta.up{background:#e8f5e9;color:#2e7d32}
  .delta.down{background:#fce4e4;color:#c62828}
  .delta.neutral{background:#f0f0f0;color:#666}

  /* Section titles */
  .section-title{font-size:16px;font-weight:700;color:#1a1a2e;margin:24px 0 12px;display:flex;align-items:center;gap:8px}

  /* Tables */
  .tbl-wrap{overflow-x:auto;background:#fff;border-radius:12px;border:1px solid #e8eaf0;margin-bottom:24px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{padding:10px 16px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#8892a4;background:#fafbfd;border-bottom:1px solid #e8eaf0;white-space:nowrap;cursor:pointer;user-select:none}
  th:hover{background:#f0f2f8}
  th.sort-asc::after{content:' ▲';font-size:9px}
  th.sort-desc::after{content:' ▼';font-size:9px}
  td{padding:10px 16px;border-bottom:1px solid #f0f2f8;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#fafbfd}

  /* Pills / states */
  .pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
  .pill.retard{background:#fce4e4;color:#c62828}
  .pill.terminee{background:#e8f5e9;color:#2e7d32}
  .pill.afaire{background:#fff3e0;color:#e65100}
  .pill.autre{background:#f0f2f8;color:#555}

  /* Coach/squad header cards */
  .squad-header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .squad-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
  .coach-name{font-size:15px;font-weight:700}
  .squad-name{font-size:12px;color:#8892a4;font-weight:500}

  /* Filters */
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .filters select,.filters input[type=text],.filters input[type=date]{padding:7px 12px;border:1px solid #d0d5e8;border-radius:8px;font-size:13px;background:#fff;color:#1a1a2e;outline:none}
  .filters select:focus,.filters input:focus{border-color:#6c5ce7}
  .filters label{font-size:12px;color:#8892a4;font-weight:600}
  .filter-group{display:flex;align-items:center;gap:6px}

  /* Chart container */
  .chart-wrap{background:#fff;border-radius:12px;border:1px solid #e8eaf0;padding:20px;margin-bottom:24px}
  .chart-wrap canvas{max-height:280px}

  /* Squad colors */
  .c-prod1{background:#6c5ce7}
  .c-prod2{background:#0984e3}
  .c-prod3{background:#e17055}
  .c-prod4{background:#a29bfe}
  .c-leg1{background:#00b894}
  .c-other{background:#b2bec3}

  /* Responsive */
  @media(max-width:600px){
    .upload-cards{flex-direction:column;align-items:center}
    .content{padding:12px}
  }
</style>
</head>
<body>

<header>
  <h1>📊 Weekly KPIs</h1>
  <div class="meta" id="meta-info"></div>
</header>
<nav id="main-nav" style="display:none">
  <button class="active" data-tab="global" onclick="switchTab('global')">Vue globale</button>
  <button data-tab="equipes" onclick="switchTab('equipes')">Équipes</button>
  <button data-tab="coaches" onclick="switchTab('coaches')">Coachs</button>
  <button data-tab="obligations" onclick="switchTab('obligations')">Obligations</button>
</nav>

<div id="app">
  <!-- Upload zone -->
  <div id="upload-zone">
    <h2>📊 Dashboard KPIs Acasi</h2>
    <p>Chargez vos fichiers pour générer le dashboard</p>
    <div class="upload-cards">
      <label class="upload-card" id="card-kpi">
        <input type="file" accept=".csv" onchange="loadFile(this,'kpi')">
        <div class="icon">📅</div>
        <h3>Semaine courante *</h3>
        <p>Weekly_user_kpis_W*.csv</p>
        <div class="fname" id="fname-kpi"></div>
      </label>
      <label class="upload-card" id="card-prev">
        <input type="file" accept=".csv" onchange="loadFile(this,'prev')">
        <div class="icon">🕐</div>
        <h3>Semaine précédente</h3>
        <p>Optionnel — deltas</p>
        <div class="fname" id="fname-prev"></div>
      </label>
      <label class="upload-card" id="card-config">
        <input type="file" accept=".json" onchange="loadFile(this,'config')">
        <div class="icon">⚙️</div>
        <h3>Config équipes</h3>
        <p>teams-config.json</p>
        <p>Optionnel</p>
        <div class="fname" id="fname-config"></div>
      </label>
      <label class="upload-card" id="card-obl">
        <input type="file" accept=".csv" onchange="loadFile(this,'obl')">
        <div class="icon">📋</div>
        <h3>Obligations</h3>
        <p>Obligations_report_W*.csv</p>
        <p>Optionnel</p>
        <div class="fname" id="fname-obl"></div>
      </label>
    </div>
    <button id="btn-generate" disabled onclick="generate()">Générer le dashboard →</button>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" style="display:none">
    <div class="content" id="tab-global"></div>
    <div class="content" id="tab-equipes" style="display:none"></div>
    <div class="content" id="tab-coaches" style="display:none"></div>
    <div class="content" id="tab-obligations" style="display:none"></div>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
var state = {
  kpiRows: [],
  prevRows: [],
  oblRows: [],
  teamsConfig: null,
  filename: '__FILENAME__',
  date: '__DATE__'
};

// ── Obligations column constants ──────────────────────────────────────────────
var OBL = {
  FAMILLE:    'FAMILLE',
  DECLARATION:'DÉCLARATION',
  ENTREPRISE: 'ENTREPRISE',
  ETAT:       'ÉTAT',
  ECHEANCE:   'ÉCHÉANCE',
  STATUT:     'STATUT',
  COACH:      'COACH'
};

// ── Squad mapping ─────────────────────────────────────────────────────────────
var SQUAD_MAP = {
  'Rouge':'PROD-1','rouge':'PROD-1',
  'Bleue':'PROD-2','bleue':'PROD-2',
  'Orange':'PROD-3','orange':'PROD-3',
  'Violet':'PROD-4','violet':'PROD-4','Rose':'PROD-4','rose':'PROD-4',
  'LEG-1':'LEG-1','leg-1':'LEG-1','Leg-1':'LEG-1',
  'PROD-1':'PROD-1','PROD-2':'PROD-2','PROD-3':'PROD-3','PROD-4':'PROD-4'
};
var SQUAD_COLORS = {'PROD-1':'#6c5ce7','PROD-2':'#0984e3','PROD-3':'#e17055','PROD-4':'#a29bfe','LEG-1':'#00b894'};
var SQUAD_CSS = {'PROD-1':'c-prod1','PROD-2':'c-prod2','PROD-3':'c-prod3','PROD-4':'c-prod4','LEG-1':'c-leg1'};

function normalizeSquad(raw){
  if(!raw) return 'Autre';
  var s = String(raw).trim();
  return SQUAD_MAP[s] || s;
}

// ── Auto-load from injected base64 ────────────────────────────────────────────
(function autoLoad(){
  var b64csv = '__CSV__';
  var b64obl = '__OBLCSV__';
  if(b64csv === '__CSV__') return; // still a template placeholder
  try{
    var csvText = new TextDecoder('utf-8').decode(Uint8Array.from(atob(b64csv), c=>c.charCodeAt(0)));
    var parsed = Papa.parse(csvText, {header:true, skipEmptyLines:true});
    state.kpiRows = parsed.data;
    state.filename = '__FILENAME__';
    state.date = '__DATE__';
    document.getElementById('meta-info').textContent = '__FILENAME__' + ' — ' + '__DATE__';
  } catch(e){ console.error('autoLoad kpi error', e); return; }
  if(b64obl && b64obl !== '__OBLCSV__'){
    try{
      var oblText = new TextDecoder('utf-8').decode(Uint8Array.from(atob(b64obl), c=>c.charCodeAt(0)));
      var oblParsed = Papa.parse(oblText, {header:true, skipEmptyLines:true});
      state.oblRows = oblParsed.data;
    } catch(e){ console.error('autoLoad obl error', e); }
  }
  generate();
})();

// ── File loading (manual upload) ──────────────────────────────────────────────
function loadFile(input, type){
  var file = input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var text = e.target.result;
    if(type === 'kpi'){
      var p = Papa.parse(text, {header:true, skipEmptyLines:true});
      state.kpiRows = p.data;
      state.filename = file.name;
      document.getElementById('fname-kpi').textContent = file.name;
      document.getElementById('card-kpi').classList.add('loaded');
    } else if(type === 'prev'){
      var p = Papa.parse(text, {header:true, skipEmptyLines:true});
      state.prevRows = p.data;
      document.getElementById('fname-prev').textContent = file.name;
      document.getElementById('card-prev').classList.add('loaded');
    } else if(type === 'config'){
      try{ state.teamsConfig = JSON.parse(text); } catch(ex){}
      document.getElementById('fname-config').textContent = file.name;
      document.getElementById('card-config').classList.add('loaded');
    } else if(type === 'obl'){
      var p = Papa.parse(text, {header:true, skipEmptyLines:true});
      state.oblRows = p.data;
      document.getElementById('fname-obl').textContent = file.name;
      document.getElementById('card-obl').classList.add('loaded');
    }
    document.getElementById('btn-generate').disabled = state.kpiRows.length === 0;
  };
  reader.readAsText(file, 'utf-8');
}

// ── Generate ──────────────────────────────────────────────────────────────────
function generate(){
  if(state.kpiRows.length === 0) return;
  document.getElementById('upload-zone').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('main-nav').style.display = 'flex';
  if(state.filename && state.filename !== '__FILENAME__'){
    document.getElementById('meta-info').textContent = state.filename + (state.date && state.date !== '__DATE__' ? ' — ' + state.date : '');
  }
  buildGlobal();
  buildEquipes();
  buildCoaches();
  if(state.oblRows.length > 0) buildObligations();
  updateTabBadges();
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(name){
  ['global','equipes','coaches','obligations'].forEach(function(t){
    document.getElementById('tab-'+t).style.display = (t===name) ? 'block' : 'none';
  });
  document.querySelectorAll('nav button').forEach(function(b){
    b.classList.toggle('active', b.dataset.tab === name);
  });
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function num(v){ var n=parseFloat(String(v).replace(',','.')); return isNaN(n)?0:n; }
function pct(v){ var s=String(v||'').replace('%','').replace(',','.'); var n=parseFloat(s); return isNaN(n)?0:n; }
function fmt(n,d){ if(n===null||n===undefined||isNaN(n)) return '—'; return Number(n).toLocaleString('fr-FR',{maximumFractionDigits:d||0}); }
function fmtPct(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return Number(n).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'; }

function getCol(row, candidates){
  for(var i=0;i<candidates.length;i++){ if(row[candidates[i]] !== undefined) return row[candidates[i]]; }
  return '';
}

function deltaHtml(curr, prev, higherIsBetter, isPct){
  if(prev === null || prev === undefined || isNaN(prev)) return '';
  var diff = curr - prev;
  if(diff === 0) return '<span class="delta neutral">= 0</span>';
  var isGood = higherIsBetter ? diff > 0 : diff < 0;
  var cls = isGood ? 'up' : 'down';
  var arrow = diff > 0 ? '▲' : '▼';
  var val = isPct ? fmtPct(Math.abs(diff)) : fmt(Math.abs(diff),1);
  return '<span class="delta '+cls+'">'+arrow+' '+val+'</span>';
}

function groupBy(rows, key){
  var g = {};
  rows.forEach(function(r){
    var k = r[key] || '';
    if(!g[k]) g[k] = [];
    g[k].push(r);
  });
  return g;
}

// ── Obligations helpers ───────────────────────────────────────────────────────
function isOblRetard(row){ return String(row[OBL.ETAT]||'').toLowerCase().trim() === 'en retard'; }
function isOblAFaire(row){
  var e = String(row[OBL.ETAT]||'').toLowerCase().trim();
  return e !== 'terminée' && e !== 'terminee' && e !== 'en retard';
}
function isOblActive(row){
  var e = String(row[OBL.ETAT]||'').toLowerCase().trim();
  return e !== 'terminée' && e !== 'terminee';
}

function normalizeCoach(raw){
  if(!raw) return '';
  return String(raw).trim().toLowerCase();
}

function oblForCoach(coachName){
  var nc = normalizeCoach(coachName);
  return state.oblRows.filter(function(r){
    return normalizeCoach(r[OBL.COACH]) === nc;
  });
}

function oblForSquad(squadName){
  // Get coaches for this squad, then their obligations
  var coaches = getCoachesForSquad(squadName);
  var nc = coaches.map(normalizeCoach);
  return state.oblRows.filter(function(r){
    return nc.indexOf(normalizeCoach(r[OBL.COACH])) >= 0;
  });
}

function getCoachesForSquad(squadName){
  var coaches = [];
  var byCoach = groupBy(state.kpiRows, detectCoachCol());
  Object.keys(byCoach).forEach(function(c){
    var rows = byCoach[c];
    var sq = normalizeSquad(getCol(rows[0], ['Squad','squad','Equipe','équipe','equipe']));
    if(sq === squadName) coaches.push(c);
  });
  return coaches;
}

function detectCoachCol(){
  if(state.kpiRows.length === 0) return 'Coach';
  var keys = Object.keys(state.kpiRows[0]);
  var candidates = ['Coach','coach','Prénom Nom','Prenom Nom','Nom complet','nom_complet','Collaborateur','collaborateur','Nom','nom','Prénom','prenom','Name','name','User','user','Email','email'];
  for(var i=0;i<candidates.length;i++) if(keys.indexOf(candidates[i])>=0) return candidates[i];
  // Partial match
  var kw = ['coach','nom','prenom','name','user','collaborateur'];
  for(var j=0;j<keys.length;j++){
    var kl = keys[j].toLowerCase();
    for(var k=0;k<kw.length;k++) if(kl.indexOf(kw[k])>=0) return keys[j];
  }
  return keys[0];
}

function parseEcheanceISO(str){
  if(!str) return '';
  var s = String(str).trim();
  // dd/mm/yyyy → yyyy-mm-dd
  var m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(m) return m[3]+'-'+m[2]+'-'+m[1];
  // already yyyy-mm-dd
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  return '';
}

function oblStatePill(etat){
  var e = String(etat||'').trim();
  var el = e.toLowerCase();
  if(el === 'en retard') return '<span class="pill retard">En retard</span>';
  if(el === 'terminée' || el === 'terminee') return '<span class="pill terminee">Terminée</span>';
  if(el === 'à faire' || el === 'a faire') return '<span class="pill afaire">À faire</span>';
  return '<span class="pill afaire">'+e+'</span>';
}

// ── Tab: Global ───────────────────────────────────────────────────────────────
function buildGlobal(){
  var rows = state.kpiRows;
  var prev = state.prevRows;
  var coachCol = detectCoachCol();

  // Detect columns
  var keys = Object.keys(rows[0] || {});
  var cols = {
    dossiers: findCol(keys, ['Dossiers assignés','Dossiers assignes','dossiers_assignes','Dossiers','dossiers','Nb dossiers','Portefeuille','portefeuille']) || findColPartial(keys,'dossier'),
    retard:   findCol(keys, ['Dossiers en retard','dossiers_retard','En retard','en_retard','Retard','retard']) || findColPartial(keys,'retard'),
    bilans:   findCol(keys, ['Bilans produits','bilans_produits','Bilans','bilans','Bilan']) || findColPartial(keys,'bilan'),
    taux:     findCol(keys, ['Taux de traitement','taux_traitement','Taux traitement','taux','Taux','% traitement']) || findColPartial(keys,'taux'),
    nps:      findCol(keys, ['NPS','nps','Score NPS','score_nps']) || findColPartial(keys,'nps'),
    liasses:  findCol(keys, ['Liasses fiscales','liasses_fiscales','Liasses','liasses','Liasse']) || findColPartial(keys,'liasse')
  };

  var totDossiers = sumCol(rows, cols.dossiers);
  var totRetard   = sumCol(rows, cols.retard);
  var totBilans   = sumCol(rows, cols.bilans);
  var avgTaux     = avgCol(rows, cols.taux);
  var avgNPS      = avgCol(rows, cols.nps);
  var totLiasses  = sumCol(rows, cols.liasses);

  var prevTotD = prev.length ? sumCol(prev, cols.dossiers) : null;
  var prevTotR = prev.length ? sumCol(prev, cols.retard)   : null;
  var prevAvgT = prev.length ? avgCol(prev, cols.taux)     : null;
  var prevAvgN = prev.length ? avgCol(prev, cols.nps)      : null;

  var oblRetardCount = state.oblRows.filter(isOblRetard).length;
  var oblAFaireCount = state.oblRows.filter(isOblAFaire).length;

  var html = '<div class="section-title">Vue d\'ensemble</div>';
  html += '<div class="cards-grid">';
  html += kpiCard('Dossiers assignés', fmt(totDossiers), '', deltaHtml(totDossiers, prevTotD, true, false));
  html += kpiCard('Dossiers en retard', fmt(totRetard), '', deltaHtml(totRetard, prevTotR, false, false));
  if(cols.bilans) html += kpiCard('Bilans produits', fmt(totBilans), '', '');
  if(cols.taux)   html += kpiCard('Taux de traitement', fmtPct(avgTaux), 'Moyenne équipes', deltaHtml(avgTaux, prevAvgT, true, true));
  if(cols.nps)    html += kpiCard('NPS', fmt(avgNPS,1), 'Moyenne', deltaHtml(avgNPS, prevAvgN, true, false));
  if(cols.liasses) html += kpiCard('Liasses fiscales', fmt(totLiasses), '', '');
  if(state.oblRows.length > 0){
    html += kpiCard('Obl. en retard', fmt(oblRetardCount), 'Toutes équipes', '');
    html += kpiCard('Obl. à faire', fmt(oblAFaireCount), 'Toutes équipes', '');
  }
  html += '</div>';

  // Par squad
  var bySquad = {};
  rows.forEach(function(r){
    var sq = normalizeSquad(getCol(r, ['Squad','squad','Equipe','équipe','equipe']));
    if(!bySquad[sq]) bySquad[sq] = [];
    bySquad[sq].push(r);
  });
  var squads = Object.keys(bySquad).sort();

  if(squads.length > 1 && cols.dossiers){
    html += '<div class="section-title">Par équipe</div>';
    html += '<div class="tbl-wrap"><table>';
    html += '<thead><tr><th>Équipe</th><th>Coaches</th><th>Dossiers</th>';
    if(cols.retard) html += '<th>En retard</th>';
    if(cols.taux)   html += '<th>Taux moy.</th>';
    if(state.oblRows.length > 0) html += '<th>Obl. retard</th><th>Obl. à faire</th>';
    html += '</tr></thead><tbody>';
    squads.forEach(function(sq){
      var srows = bySquad[sq];
      var color = SQUAD_COLORS[sq] || '#b2bec3';
      var obl = state.oblRows.length > 0 ? oblForSquad(sq) : [];
      html += '<tr>';
      html += '<td><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:'+color+';display:inline-block"></span><strong>'+sq+'</strong></div></td>';
      html += '<td>'+srows.length+'</td>';
      html += '<td>'+fmt(sumCol(srows, cols.dossiers))+'</td>';
      if(cols.retard) html += '<td>'+fmt(sumCol(srows, cols.retard))+'</td>';
      if(cols.taux)   html += '<td>'+fmtPct(avgCol(srows, cols.taux))+'</td>';
      if(state.oblRows.length > 0){
        html += '<td>'+obl.filter(isOblRetard).length+'</td>';
        html += '<td>'+obl.filter(isOblAFaire).length+'</td>';
      }
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  }

  // Obligations summary by famille × état
  if(state.oblRows.length > 0){
    var familles = {};
    state.oblRows.forEach(function(r){
      var f = r[OBL.FAMILLE] || 'Autre';
      var e = String(r[OBL.ETAT]||'').trim();
      if(!familles[f]) familles[f] = {retard:0, afaire:0, terminee:0, total:0};
      familles[f].total++;
      if(isOblRetard(r)) familles[f].retard++;
      else if(isOblAFaire(r)) familles[f].afaire++;
      else familles[f].terminee++;
    });
    var fkeys = Object.keys(familles).sort();
    html += '<div class="section-title">Obligations par famille</div>';
    html += '<div class="tbl-wrap"><table>';
    html += '<thead><tr><th>Famille</th><th>En retard</th><th>À faire</th><th>Terminées</th><th>Total</th></tr></thead><tbody>';
    fkeys.forEach(function(f){
      var d = familles[f];
      html += '<tr><td><strong>'+f+'</strong></td>';
      html += '<td>'+(d.retard>0?'<span class="pill retard">'+d.retard+'</span>':'0')+'</td>';
      html += '<td>'+(d.afaire>0?'<span class="pill afaire">'+d.afaire+'</span>':'0')+'</td>';
      html += '<td>'+d.terminee+'</td>';
      html += '<td>'+d.total+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }

  document.getElementById('tab-global').innerHTML = html;
}

function kpiCard(label, value, sub, deltaHtmlStr){
  return '<div class="card"><div class="card-label">'+label+'</div><div class="card-value">'+value+'</div>'+(sub?'<div class="card-sub">'+sub+'</div>':'')+(deltaHtmlStr||'')+'</div>';
}

function findCol(keys, candidates){
  // Exact match first
  for(var i=0;i<candidates.length;i++) if(keys.indexOf(candidates[i])>=0) return candidates[i];
  // Partial case-insensitive match
  var lc = candidates.map(function(c){return c.toLowerCase().replace(/[éèê]/g,'e').replace(/[àâ]/g,'a').replace(/[ùû]/g,'u').replace(/[îï]/g,'i').replace(/[ôö]/g,'o');});
  for(var j=0;j<keys.length;j++){
    var kn = keys[j].toLowerCase().replace(/[éèê]/g,'e').replace(/[àâ]/g,'a').replace(/[ùû]/g,'u').replace(/[îï]/g,'i').replace(/[ôö]/g,'o');
    for(var k=0;k<lc.length;k++){
      if(kn.indexOf(lc[k])>=0 || lc[k].indexOf(kn)>=0) return keys[j];
    }
  }
  return null;
}

function findColPartial(keys, keyword){
  var kw = keyword.toLowerCase().replace(/[éèê]/g,'e').replace(/[àâ]/g,'a').replace(/[ùû]/g,'u');
  for(var j=0;j<keys.length;j++){
    var kn = keys[j].toLowerCase().replace(/[éèê]/g,'e').replace(/[àâ]/g,'a').replace(/[ùû]/g,'u');
    if(kn.indexOf(kw)>=0) return keys[j];
  }
  return null;
}

function sumCol(rows, col){
  if(!col) return 0;
  return rows.reduce(function(a,r){ return a + num(r[col]); }, 0);
}
function avgCol(rows, col){
  if(!col || rows.length === 0) return 0;
  var vals = rows.map(function(r){ return num(r[col]); }).filter(function(v){ return !isNaN(v); });
  if(vals.length === 0) return 0;
  return vals.reduce(function(a,b){return a+b;},0) / vals.length;
}

// ── Tab: Équipes ──────────────────────────────────────────────────────────────
var equipesSortCol = null, equipesSortDir = 1;

function buildEquipes(){
  var rows = state.kpiRows;
  var coachCol = detectCoachCol();
  var keys = Object.keys(rows[0] || {});
  var cols = {
    dossiers: findCol(keys, ['Dossiers assignés','Dossiers assignes','Dossiers','dossiers','Nb dossiers','Portefeuille']) || findColPartial(keys,'dossier'),
    retard:   findCol(keys, ['Dossiers en retard','En retard','en_retard','Retard']) || findColPartial(keys,'retard'),
    bilans:   findCol(keys, ['Bilans produits','Bilans','bilans','Bilan']) || findColPartial(keys,'bilan'),
    taux:     findCol(keys, ['Taux de traitement','Taux traitement','taux','Taux','% traitement']) || findColPartial(keys,'taux'),
    nps:      findCol(keys, ['NPS','nps','Score NPS']) || findColPartial(keys,'nps'),
    liasses:  findCol(keys, ['Liasses fiscales','Liasses','liasses','Liasse']) || findColPartial(keys,'liasse'),
    squad:    findCol(keys, ['Squad','squad','Equipe','Équipe','équipe','equipe']) || findColPartial(keys,'equipe') || findColPartial(keys,'squad')
  };

  var bySquad = {};
  rows.forEach(function(r){
    var sq = normalizeSquad(r[cols.squad] || '');
    if(!bySquad[sq]) bySquad[sq] = [];
    bySquad[sq].push(r);
  });
  var squads = Object.keys(bySquad).sort();

  // Get all coaches for filter
  var allCoachesEq = [...new Set(rows.map(function(r){ return r[coachCol]||''; }).filter(Boolean))].sort();

  // Build table data
  var tableData = squads.map(function(sq){
    var srows = bySquad[sq];
    var obl = state.oblRows.length > 0 ? oblForSquad(sq) : [];
    return {
      squad: sq,
      coachs: srows.length,
      coachList: srows.map(function(r){ return r[coachCol]||''; }),
      dossiers: sumCol(srows, cols.dossiers),
      retard: sumCol(srows, cols.retard),
      bilans: sumCol(srows, cols.bilans),
      taux: avgCol(srows, cols.taux),
      nps: avgCol(srows, cols.nps),
      liasses: sumCol(srows, cols.liasses),
      oblRetard: obl.filter(isOblRetard).length,
      oblAFaire: obl.filter(isOblAFaire).length
    };
  });

  window._equipesData = tableData;
  window._equipesCols = cols;

  // Build filter UI once
  var html = '<div class="section-title">Tableau des équipes</div>';
  html += '<div class="filters">';
  html += '<div class="filter-group"><label>Coach</label><select id="eq-f-coach" onchange="filterEquipes()"><option value="">Tous</option>';
  allCoachesEq.forEach(function(c){ html += '<option value="'+escHtml(c)+'">'+escHtml(c)+'</option>'; });
  html += '</select></div>';
  html += '<div class="filter-group"><label>Recherche</label><input type="text" id="eq-f-search" placeholder="Équipe…" oninput="filterEquipes()"></div>';
  html += '</div><div id="eq-table-wrap"></div>';
  document.getElementById('tab-equipes').innerHTML = html;
  filterEquipes();
}

function filterEquipes(){
  var coach  = document.getElementById('eq-f-coach')  ? document.getElementById('eq-f-coach').value  : '';
  var search = document.getElementById('eq-f-search') ? document.getElementById('eq-f-search').value.toLowerCase() : '';
  var data = window._equipesData.filter(function(d){
    if(coach  && d.coachList.indexOf(coach) < 0) return false;
    if(search && d.squad.toLowerCase().indexOf(search) < 0) return false;
    return true;
  });
  if(equipesSortCol){
    data = data.sort(function(a,b){
      var av=a[equipesSortCol],bv=b[equipesSortCol];
      if(typeof av==='string') return av.localeCompare(bv)*equipesSortDir;
      return (av-bv)*equipesSortDir;
    });
  }
  renderEquipesTable(data, window._equipesCols);
}

function renderEquipesTable(data, cols){
  var hasObl = state.oblRows.length > 0;
  var html = '<div class="tbl-wrap"><table id="tbl-equipes">';
  html += '<thead><tr>';
  html += thS('Équipe','squad') + thS('Coachs','coachs');
  if(cols.dossiers) html += thS('Dossiers','dossiers');
  if(cols.retard)   html += thS('En retard','retard');
  if(cols.bilans)   html += thS('Bilans','bilans');
  if(cols.taux)     html += thS('Taux moy.','taux');
  if(cols.nps)      html += thS('NPS','nps');
  if(cols.liasses)  html += thS('Liasses','liasses');
  if(hasObl){
    html += thS('Obl. en retard','oblRetard');
    html += thS('Obl. à faire','oblAFaire');
  }
  html += '</tr></thead><tbody>';

  data.forEach(function(d){
    var color = SQUAD_COLORS[d.squad] || '#b2bec3';
    html += '<tr>';
    html += '<td><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:'+color+';display:inline-block"></span><strong>'+escHtml(d.squad)+'</strong></div></td>';
    html += '<td>'+d.coachs+'</td>';
    if(cols.dossiers) html += '<td>'+fmt(d.dossiers)+'</td>';
    if(cols.retard)   html += '<td>'+fmt(d.retard)+'</td>';
    if(cols.bilans)   html += '<td>'+fmt(d.bilans)+'</td>';
    if(cols.taux)     html += '<td>'+fmtPct(d.taux)+'</td>';
    if(cols.nps)      html += '<td>'+fmt(d.nps,1)+'</td>';
    if(cols.liasses)  html += '<td>'+fmt(d.liasses)+'</td>';
    if(hasObl){
      html += '<td>'+(d.oblRetard>0?'<span class="pill retard">'+d.oblRetard+'</span>':'0')+'</td>';
      html += '<td>'+(d.oblAFaire>0?'<span class="pill afaire">'+d.oblAFaire+'</span>':'0')+'</td>';
    }
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('eq-table-wrap').innerHTML = html;
}

function thS(label, key){
  var cls = equipesSortCol === key ? (equipesSortDir > 0 ? 'sort-asc' : 'sort-desc') : '';
  return '<th class="'+cls+'" onclick="sortEquipes(\''+key+'\')">'+label+'</th>';
}

function sortEquipes(key){
  if(equipesSortCol === key) equipesSortDir *= -1;
  else { equipesSortCol = key; equipesSortDir = 1; }
  filterEquipes();
}

// ── Tab: Coachs ───────────────────────────────────────────────────────────────
var coachesSortCol = null, coachesSortDir = 1;

function buildCoaches(){
  var rows = state.kpiRows;
  var prev = state.prevRows;
  var coachCol = detectCoachCol();
  var keys = Object.keys(rows[0] || {});
  var cols = {
    dossiers: findCol(keys, ['Dossiers assignés','Dossiers assignes','Dossiers','dossiers','Nb dossiers','Portefeuille']) || findColPartial(keys,'dossier'),
    retard:   findCol(keys, ['Dossiers en retard','En retard','en_retard','Retard']) || findColPartial(keys,'retard'),
    bilans:   findCol(keys, ['Bilans produits','Bilans','bilans','Bilan']) || findColPartial(keys,'bilan'),
    taux:     findCol(keys, ['Taux de traitement','Taux traitement','taux','Taux','% traitement']) || findColPartial(keys,'taux'),
    nps:      findCol(keys, ['NPS','nps','Score NPS']) || findColPartial(keys,'nps'),
    liasses:  findCol(keys, ['Liasses fiscales','Liasses','liasses','Liasse']) || findColPartial(keys,'liasse'),
    squad:    findCol(keys, ['Squad','squad','Equipe','Équipe','équipe','equipe']) || findColPartial(keys,'equipe') || findColPartial(keys,'squad')
  };

  var byCoach = groupBy(rows, coachCol);
  var prevByCoach = prev.length ? groupBy(prev, coachCol) : {};
  var allSquads = [...new Set(Object.keys(byCoach).map(function(c){
    return normalizeSquad(getCol(byCoach[c][0], ['Squad','squad','Equipe','Équipe','équipe','equipe']));
  }))].sort();

  var tableData = Object.keys(byCoach).sort().map(function(c){
    var cr = byCoach[c];
    var pr = prevByCoach[c] || [];
    var obl = state.oblRows.length > 0 ? oblForCoach(c) : [];
    return {
      coach: c,
      squad: normalizeSquad(getCol(cr[0], ['Squad','squad','Equipe','Équipe','équipe','equipe'])),
      dossiers: sumCol(cr, cols.dossiers),
      retard: sumCol(cr, cols.retard),
      bilans: sumCol(cr, cols.bilans),
      taux: avgCol(cr, cols.taux),
      nps: avgCol(cr, cols.nps),
      liasses: sumCol(cr, cols.liasses),
      prevDossiers: pr.length ? sumCol(pr, cols.dossiers) : null,
      oblRetard: obl.filter(isOblRetard).length,
      oblAFaire: obl.filter(isOblAFaire).length
    };
  });

  window._coachesData = tableData;
  window._coachesCols = cols;

  var html = '<div class="section-title">Tableau des coachs</div>';
  html += '<div class="filters">';
  html += '<div class="filter-group"><label>Équipe</label><select id="co-f-squad" onchange="filterCoaches()"><option value="">Toutes</option>';
  allSquads.forEach(function(s){ html += '<option value="'+escHtml(s)+'">'+escHtml(s)+'</option>'; });
  html += '</select></div>';
  html += '<div class="filter-group"><label>Recherche</label><input type="text" id="co-f-search" placeholder="Coach…" oninput="filterCoaches()"></div>';
  html += '</div><div id="co-table-wrap"></div>';
  document.getElementById('tab-coaches').innerHTML = html;
  filterCoaches();
}

function filterCoaches(){
  var squad  = document.getElementById('co-f-squad')  ? document.getElementById('co-f-squad').value  : '';
  var search = document.getElementById('co-f-search') ? document.getElementById('co-f-search').value.toLowerCase() : '';
  var data = window._coachesData.filter(function(d){
    if(squad  && d.squad !== squad) return false;
    if(search && d.coach.toLowerCase().indexOf(search) < 0) return false;
    return true;
  });
  if(coachesSortCol){
    data = data.sort(function(a,b){
      var av=a[coachesSortCol],bv=b[coachesSortCol];
      if(av===null||av===undefined) return 1;
      if(bv===null||bv===undefined) return -1;
      if(typeof av==='string') return av.localeCompare(bv)*coachesSortDir;
      return (av-bv)*coachesSortDir;
    });
  }
  renderCoachesTable(data, window._coachesCols);
}

function renderCoachesTable(data, cols){
  var hasObl = state.oblRows.length > 0;
  var hasPrev = state.prevRows.length > 0;
  var html = '<div class="tbl-wrap"><table id="tbl-coaches">';
  html += '<thead><tr>';
  html += cthS('Coach','coach') + cthS('Équipe','squad');
  if(cols.dossiers) html += cthS('Dossiers','dossiers');
  if(hasPrev && cols.dossiers) html += cthS('Δ Dossiers','prevDossiers');
  if(cols.retard)   html += cthS('En retard','retard');
  if(cols.bilans)   html += cthS('Bilans','bilans');
  if(cols.taux)     html += cthS('Taux','taux');
  if(cols.nps)      html += cthS('NPS','nps');
  if(cols.liasses)  html += cthS('Liasses','liasses');
  if(hasObl){
    html += cthS('Obl. en retard','oblRetard');
    html += cthS('Obl. à faire','oblAFaire');
  }
  html += '</tr></thead><tbody>';

  data.forEach(function(d){
    var color = SQUAD_COLORS[d.squad] || '#b2bec3';
    html += '<tr>';
    html += '<td><strong>'+escHtml(d.coach)+'</strong></td>';
    html += '<td><div style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:'+color+';display:inline-block"></span>'+escHtml(d.squad)+'</div></td>';
    if(cols.dossiers) html += '<td>'+fmt(d.dossiers)+'</td>';
    if(hasPrev && cols.dossiers) html += '<td>'+deltaHtml(d.dossiers, d.prevDossiers, true, false)+'</td>';
    if(cols.retard)   html += '<td>'+fmt(d.retard)+'</td>';
    if(cols.bilans)   html += '<td>'+fmt(d.bilans)+'</td>';
    if(cols.taux)     html += '<td>'+fmtPct(d.taux)+'</td>';
    if(cols.nps)      html += '<td>'+fmt(d.nps,1)+'</td>';
    if(cols.liasses)  html += '<td>'+fmt(d.liasses)+'</td>';
    if(hasObl){
      html += '<td>'+(d.oblRetard>0?'<span class="pill retard">'+d.oblRetard+'</span>':'0')+'</td>';
      html += '<td>'+(d.oblAFaire>0?'<span class="pill afaire">'+d.oblAFaire+'</span>':'0')+'</td>';
    }
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('co-table-wrap').innerHTML = html;
}

function cthS(label, key){
  var cls = coachesSortCol === key ? (coachesSortDir > 0 ? 'sort-asc' : 'sort-desc') : '';
  return '<th class="'+cls+'" onclick="sortCoaches(\''+key+'\')">'+label+'</th>';
}

function sortCoaches(key){
  if(coachesSortCol === key) coachesSortDir *= -1;
  else { coachesSortCol = key; coachesSortDir = 1; }
  filterCoaches();
}

// ── Tab: Obligations ──────────────────────────────────────────────────────────
function buildObligations(){
  var oblRows = state.oblRows;
  if(!oblRows.length) return;

  // Get unique values for filters
  var coaches = [...new Set(oblRows.map(function(r){ return r[OBL.COACH]||''; }).filter(Boolean))].sort();
  var familles = [...new Set(oblRows.map(function(r){ return r[OBL.FAMILLE]||''; }).filter(Boolean))].sort();
  var etats = [...new Set(oblRows.map(function(r){ return r[OBL.ETAT]||''; }).filter(Boolean))].sort();

  var html = '<div class="section-title">Obligations fiscales</div>';

  // Filters
  html += '<div class="filters">';
  html += '<div class="filter-group"><label>Coach</label><select id="obl-f-coach" onchange="filterObligations()"><option value="">Tous</option>';
  coaches.forEach(function(c){ html += '<option value="'+c+'">'+c+'</option>'; });
  html += '</select></div>';

  html += '<div class="filter-group"><label>Famille</label><select id="obl-f-famille" onchange="filterObligations()"><option value="">Toutes</option>';
  familles.forEach(function(f){ html += '<option value="'+f+'">'+f+'</option>'; });
  html += '</select></div>';

  html += '<div class="filter-group"><label>État</label><select id="obl-f-etat" onchange="filterObligations()"><option value="">Tous</option>';
  etats.forEach(function(e){ html += '<option value="'+e+'">'+e+'</option>'; });
  html += '</select></div>';

  html += '<div class="filter-group"><label>Recherche</label><input type="text" id="obl-f-search" placeholder="Entreprise…" oninput="filterObligations()"></div>';

  html += '<div class="filter-group"><label>Échéance du</label><input type="date" id="obl-f-ech-from" onchange="filterObligations()"></div>';
  html += '<div class="filter-group"><label>au</label><input type="date" id="obl-f-ech-to" onchange="filterObligations()"></div>';
  html += '</div>';

  // Table
  html += '<div id="obl-table-wrap"></div>';
  document.getElementById('tab-obligations').innerHTML = html;
  filterObligations();
}

function filterObligations(){
  var coach   = document.getElementById('obl-f-coach')   ? document.getElementById('obl-f-coach').value   : '';
  var famille = document.getElementById('obl-f-famille') ? document.getElementById('obl-f-famille').value : '';
  var etat    = document.getElementById('obl-f-etat')    ? document.getElementById('obl-f-etat').value    : '';
  var search  = document.getElementById('obl-f-search')  ? document.getElementById('obl-f-search').value.toLowerCase() : '';
  var echFrom = document.getElementById('obl-f-ech-from')? document.getElementById('obl-f-ech-from').value : '';
  var echTo   = document.getElementById('obl-f-ech-to')  ? document.getElementById('obl-f-ech-to').value   : '';

  var filtered = state.oblRows.filter(function(r){
    if(coach   && r[OBL.COACH]   !== coach)   return false;
    if(famille && r[OBL.FAMILLE] !== famille) return false;
    if(etat    && r[OBL.ETAT]    !== etat)    return false;
    if(search  && String(r[OBL.ENTREPRISE]||'').toLowerCase().indexOf(search) < 0 &&
                  String(r[OBL.DECLARATION]||'').toLowerCase().indexOf(search) < 0) return false;
    if(echFrom || echTo){
      var iso = parseEcheanceISO(r[OBL.ECHEANCE]);
      if(echFrom && iso && iso < echFrom) return false;
      if(echTo   && iso && iso > echTo)   return false;
      if((echFrom || echTo) && !iso) return false;
    }
    return true;
  });

  var html = '<div class="tbl-wrap"><table>';
  html += '<thead><tr><th>'+OBL.FAMILLE+'</th><th>'+OBL.DECLARATION+'</th><th>'+OBL.ENTREPRISE+'</th><th>État</th><th>'+OBL.ECHEANCE+'</th><th>'+OBL.COACH+'</th></tr></thead>';
  html += '<tbody>';
  filtered.forEach(function(r){
    var iso = parseEcheanceISO(r[OBL.ECHEANCE]);
    html += '<tr>';
    html += '<td>'+escHtml(r[OBL.FAMILLE]||'')+'</td>';
    html += '<td>'+escHtml(r[OBL.DECLARATION]||'')+'</td>';
    html += '<td>'+escHtml(r[OBL.ENTREPRISE]||'')+'</td>';
    html += '<td>'+oblStatePill(r[OBL.ETAT])+'</td>';
    html += '<td data-ech="'+(iso||'')+'">'+escHtml(r[OBL.ECHEANCE]||'')+'</td>';
    html += '<td>'+escHtml(r[OBL.COACH]||'')+'</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<div style="font-size:12px;color:#8892a4;margin-top:8px">'+filtered.length+' obligation'+(filtered.length>1?'s':'')+' affichée'+(filtered.length>1?'s':'')+'</div>';

  var wrap = document.getElementById('obl-table-wrap');
  if(wrap) wrap.innerHTML = html;
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

}
